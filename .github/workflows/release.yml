name: Release

# Push a version tag (for example v0.1.0) to build installers and binaries.
# The workflow creates a DRAFT release; review the assets, then publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: WebKitGTK and tray libraries (Linux, for the Tauri app)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the Go engine (CLI and daemon)
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          go build -trimpath -o "dist-release/tpt-sync$ext" ./engine/cmd/tpt-sync

      - name: Build the Rust hash helper
        shell: bash
        run: |
          cargo build --release -p tpt-sync-hash
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          cp "target/release/tpt-sync-hash$ext" dist-release/

      - name: Package CLI archive
        id: cli
        shell: bash
        run: |
          name="tpt-sync-cli-${GITHUB_REF_NAME}-${RUNNER_OS,,}"
          cd dist-release
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${name}.zip" * > /dev/null
            echo "file=${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "../${name}.tar.gz" *
            echo "file=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the desktop app installers
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "tpt-sync ${{ github.ref_name }}"
          releaseBody: "Download the installer for your OS below. The CLI archive contains tpt-sync and tpt-sync-hash."
          releaseDraft: true
          prerelease: false

      - name: Attach CLI archive to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.cli.outputs.file }}" --clobber
